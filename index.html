<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
 <link rel="manifest" href="/Player/manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Patientenvideos</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f14;
    --surface: #161a23;
    --card: #1c2130;
    --accent: #4f9cf9;
    --accent2: #a78bfa;
    --text: #f0f4ff;
    --muted: #8891a8;
    --border: rgba(255,255,255,0.07);
    --radius: 16px;
  }

  html, body {
    height: 100%;
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── Header ── */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(13,15,20,0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon {
    width: 38px; height: 38px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .logo-text { font-family: 'Playfair Display', serif; font-size: 18px; }
  .logo-sub { font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }

  .upload-btn {
    display: flex; align-items: center; gap: 7px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; border: none; border-radius: 12px;
    padding: 10px 18px; font-size: 15px;
    font-family: 'DM Sans', sans-serif; font-weight: 600;
    cursor: pointer; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── Tabs ── */
  .tabs-wrap {
    padding: 16px 20px 0;
    display: flex; gap: 8px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .tabs-wrap::-webkit-scrollbar { display: none; }

  .tab {
    padding: 8px 18px; border-radius: 50px; font-size: 13px; font-weight: 500;
    border: 1px solid var(--border); background: var(--surface); color: var(--muted);
    cursor: pointer; white-space: nowrap; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.2s;
  }
  .tab.active {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; border-color: transparent;
  }

  /* ── Grid ── */
  .grid {
    padding: 16px 20px 48px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 14px;
  }

  /* ── Card ── */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    overflow: hidden;
    cursor: pointer;
    position: relative;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.18s, box-shadow 0.18s;
    active-scale: 0.97;
  }
  .card:active { transform: scale(0.97); }

  .thumb-placeholder {
    width: 100%; aspect-ratio: 16/10;
    background: linear-gradient(135deg, #1a1f2e, #232a3e);
    display: flex; align-items: center; justify-content: center;
    font-size: 44px; position: relative; overflow: hidden;
  }
  .thumb-placeholder::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(79,156,249,0.07), rgba(167,139,250,0.07));
  }
  .thumb-play {
    position: absolute; bottom: 8px; right: 10px;
    background: rgba(79,156,249,0.85); border-radius: 50%;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; z-index: 2;
  }

  .card-info { padding: 10px 13px 13px; }
  .card-category {
    font-size: 10px; font-weight: 600; letter-spacing: 1.2px;
    text-transform: uppercase; color: var(--accent); margin-bottom: 4px;
  }
  .card-title { font-size: 14px; font-weight: 500; line-height: 1.4; }

  .card-del {
    position: absolute; top: 7px; right: 7px;
    width: 30px; height: 30px;
    background: rgba(0,0,0,0.65); border: none; border-radius: 50%;
    color: #fff; font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.2s;
    touch-action: manipulation;
  }
  .card:hover .card-del { opacity: 1; }
  /* Always show delete on touch devices */
  @media (pointer: coarse) { .card-del { opacity: 0.7; } }

  /* ── Empty ── */
  .empty { grid-column: 1/-1; text-align: center; padding: 80px 20px; color: var(--muted); }
  .empty-icon { font-size: 52px; margin-bottom: 14px; opacity: 0.35; }
  .empty h2 { font-size: 19px; font-weight: 500; margin-bottom: 7px; color: var(--text); }
  .empty p { font-size: 14px; line-height: 1.6; }

  /* ══════════════════════════════════
     FULLSCREEN VIDEO PLAYER
  ══════════════════════════════════ */
  #player-screen {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 500;
    background: #000;
    flex-direction: column;
  }
  #player-screen.open { display: flex; }

  /* The actual video – fills all available space */
  #player-video {
    flex: 1;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
    display: block;
  }

  /* Tap area – invisible overlay for play/pause tap */
  #tap-area {
    position: absolute;
    inset: 0;
    z-index: 10;
    cursor: pointer;
  }

  /* Controls bar at bottom */
  #player-controls {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    z-index: 20;
    background: linear-gradient(transparent, rgba(0,0,0,0.85));
    padding: 32px 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: opacity 0.3s;
  }
  #player-controls.hidden { opacity: 0; pointer-events: none; }

  #player-title-bar {
    display: flex; align-items: center; justify-content: space-between;
  }
  #player-title {
    font-size: 16px; font-weight: 600;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }
  #btn-close-player {
    width: 40px; height: 40px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(8px);
    border: none; border-radius: 50%;
    color: #fff; font-size: 20px;
    cursor: pointer; touch-action: manipulation;
    display: flex; align-items: center; justify-content: center;
  }

  /* Progress bar */
  .progress-wrap {
    display: flex; align-items: center; gap: 10px;
  }
  .time-label { font-size: 12px; color: rgba(255,255,255,0.7); min-width: 38px; text-align: center; }
  #progress {
    flex: 1; height: 4px;
    -webkit-appearance: none; appearance: none;
    background: rgba(255,255,255,0.25);
    border-radius: 4px; cursor: pointer; outline: none;
  }
  #progress::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
    box-shadow: 0 0 4px rgba(0,0,0,0.5);
  }

  /* Bottom row: play + fullscreen */
  .ctrl-row {
    display: flex; align-items: center; justify-content: space-between;
  }
  .ctrl-btn {
    background: none; border: none; color: #fff;
    font-size: 28px; cursor: pointer; padding: 4px 8px;
    touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    line-height: 1;
  }

  /* Close button top-right (always visible) */
  #btn-close-top {
    position: absolute;
    top: 16px; right: 16px;
    z-index: 30;
    width: 44px; height: 44px;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(6px);
    border: none; border-radius: 50%;
    color: #fff; font-size: 22px;
    cursor: pointer; touch-action: manipulation;
    display: flex; align-items: center; justify-content: center;
  }

  /* ── Add Dialog ── */
  .dialog {
    display: none; position: fixed; inset: 0; z-index: 600;
    background: rgba(0,0,0,0.88); align-items: center; justify-content: center;
    padding: 20px;
  }
  .dialog.open { display: flex; }

  .dialog-box {
    background: var(--surface); border-radius: 20px;
    border: 1px solid var(--border); padding: 26px;
    width: 100%; max-width: 420px;
    max-height: 90vh; overflow-y: auto;
  }
  .dialog-box h3 { font-size: 18px; font-weight: 600; margin-bottom: 18px; }

  .field { margin-bottom: 13px; }
  .field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 5px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
  .field input, .field select {
    width: 100%; background: var(--bg);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 11px 14px; font-size: 15px;
    font-family: 'DM Sans', sans-serif; color: var(--text); outline: none;
    transition: border-color 0.2s;
  }
  .field input:focus, .field select:focus { border-color: var(--accent); }
  .field select option { background: var(--surface); }

  .file-drop {
    border: 2px dashed var(--border); border-radius: 12px;
    padding: 22px; text-align: center; cursor: pointer;
    font-size: 13px; color: var(--muted);
    transition: border-color 0.2s, background 0.2s;
  }
  .file-drop:active, .file-drop.drag { border-color: var(--accent); background: rgba(79,156,249,0.05); }
  .file-drop .file-icon { font-size: 26px; margin-bottom: 7px; }

  .dialog-actions { display: flex; gap: 10px; margin-top: 18px; }
  .btn-cancel {
    flex: 1; padding: 11px; background: transparent;
    border: 1px solid var(--border); border-radius: 10px;
    color: var(--muted); font-family: 'DM Sans', sans-serif;
    font-size: 15px; cursor: pointer; touch-action: manipulation;
  }
  .btn-add {
    flex: 2; padding: 11px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; border-radius: 10px; color: #fff;
    font-family: 'DM Sans', sans-serif; font-size: 15px;
    font-weight: 600; cursor: pointer; touch-action: manipulation;
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🦷</div>
    <div>
      <div class="logo-text">Patientenvideos</div>
      <div class="logo-sub">Dr. Guendouze</div>
    </div>
  </div>
  <button class="upload-btn" onclick="openDialog()">＋ Video</button>
</header>

<div class="tabs-wrap" id="tabs"></div>
<div class="grid" id="grid"></div>

<!-- ══ FULLSCREEN PLAYER ══ -->
<div id="player-screen">
  <video id="player-video" playsinline webkit-playsinline></video>

  <!-- invisible tap overlay -->
  <div id="tap-area" ontouchend="handleTap(event)" onclick="handleTap(event)"></div>

  <!-- always-visible close button top right -->
  <button id="btn-close-top" onclick="closePlayer()">✕</button>

  <!-- sliding controls bar -->
  <div id="player-controls">
    <div id="player-title-bar">
      <span id="player-title"></span>
    </div>
    <div class="progress-wrap">
      <span class="time-label" id="time-cur">0:00</span>
      <input type="range" id="progress" min="0" max="100" value="0" step="0.1"
             oninput="seekVideo(this.value)"
             ontouchstart="scrubbing=true" ontouchend="scrubbing=false">
      <span class="time-label" id="time-dur">0:00</span>
    </div>
    <div class="ctrl-row">
      <button class="ctrl-btn" id="btn-play" onclick="togglePlay()">▶</button>
      <button class="ctrl-btn" onclick="toggleNativeFS()" title="Vollbild">⛶</button>
    </div>
  </div>
</div>

<!-- ══ ADD VIDEO DIALOG ══ -->
<div class="dialog" id="dialog">
  <div class="dialog-box">
    <h3>📹 Video hinzufügen</h3>
    <div class="field">
      <label>Titel</label>
      <input type="text" id="inp-title" placeholder="z.B. Wurzelkanalbehandlung erklärt">
    </div>
    <div class="field">
      <label>Kategorie</label>
      <select id="inp-cat">
        <option value="Allgemein">Allgemein</option>
        <option value="Konservierend">Konservierend</option>
        <option value="Endodontie">Endodontie</option>
        <option value="Prothetik">Prothetik</option>
        <option value="Chirurgie">Chirurgie</option>
        <option value="Prophylaxe">Prophylaxe</option>
        <option value="Kieferorthopädie">Kieferorthopädie</option>
      </select>
    </div>
    <div class="field">
      <label>Emoji / Icon (optional)</label>
      <input type="text" id="inp-emoji" placeholder="z.B. 🦷 — leer lassen für Standard">
    </div>
    <div class="field">
      <label>Videodatei</label>
      <div class="file-drop" id="file-drop"
           onclick="document.getElementById('file-input').click()"
           ondragover="event.preventDefault();this.classList.add('drag')"
           ondragleave="this.classList.remove('drag')"
           ondrop="handleDrop(event)">
        <div class="file-icon">🎬</div>
        <div id="file-label">Tippen um Datei auszuwählen</div>
      </div>
      <input type="file" id="file-input" accept="video/*" style="display:none"
             onchange="handleFile(this.files[0])">
    </div>
    <div class="dialog-actions">
      <button class="btn-cancel" onclick="closeDialog()">Abbrechen</button>
      <button class="btn-add" onclick="addVideo()">Hinzufügen</button>
    </div>
  </div>
</div>

<script>
/* ── State ── */
let videos = [];
try { videos = JSON.parse(localStorage.getItem('patVideos') || '[]'); } catch(e) {}
let currentFile = null;
let activeCategory = 'Alle';
let scrubbing = false;
let controlsTimer = null;

const CATEGORIES = ['Alle','Konservierend','Endodontie','Prothetik','Chirurgie','Prophylaxe','Kieferorthopädie','Allgemein'];
const EMOJIS = { Endodontie:'🔬', Konservierend:'🦷', Prothetik:'😁', Chirurgie:'🩺', Prophylaxe:'✨', Kieferorthopädie:'😬', Allgemein:'📋' };

function save() {
  try { localStorage.setItem('patVideos', JSON.stringify(videos)); } catch(e) {}
}

/* ── Tabs ── */
function renderTabs() {
  document.getElementById('tabs').innerHTML = CATEGORIES.map(c =>
    `<button class="tab ${c===activeCategory?'active':''}" onclick="setCategory('${c}')">${c}</button>`
  ).join('');
}
function setCategory(cat) { activeCategory = cat; renderTabs(); renderGrid(); }

/* ── Grid ── */
function renderGrid() {
  const grid = document.getElementById('grid');
  const list = activeCategory === 'Alle' ? videos : videos.filter(v => v.category === activeCategory);
  if (!list.length) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">🎬</div><h2>Noch keine Videos</h2><p>Tippen Sie auf „＋ Video"<br>um Ihr erstes Video zu laden.</p></div>`;
    return;
  }
  grid.innerHTML = list.map(v => {
    const idx = videos.indexOf(v);
    const emoji = v.emoji || EMOJIS[v.category] || '🎬';
    return `<div class="card" onclick="playVideo(${idx})">
      <div class="thumb-placeholder">
        <span style="position:relative;z-index:1">${emoji}</span>
        <div class="thumb-play">▶</div>
      </div>
      <div class="card-info">
        <div class="card-category">${v.category}</div>
        <div class="card-title">${v.title}</div>
      </div>
      <button class="card-del" onclick="deleteVideo(event,${idx})">✕</button>
    </div>`;
  }).join('');
}

/* ══ PLAYER ══ */
const playerScreen = document.getElementById('player-screen');
const vid = document.getElementById('player-video');
const progress = document.getElementById('progress');
const btnPlay = document.getElementById('btn-play');
const controls = document.getElementById('player-controls');

function playVideo(idx) {
  const v = videos[idx];
  document.getElementById('player-title').textContent = v.title;
  vid.src = v.url;
  vid.load();
  playerScreen.classList.add('open');
  // Try landscape on Android
  if (screen.orientation && screen.orientation.lock) {
    screen.orientation.lock('landscape').catch(()=>{});
  }
  vid.play().catch(()=>{});
  showControls();
}

function closePlayer() {
  vid.pause();
  vid.src = '';
  playerScreen.classList.remove('open');
  if (screen.orientation && screen.orientation.unlock) {
    screen.orientation.unlock();
  }
}

function togglePlay() {
  if (vid.paused) {
    vid.play();
  } else {
    vid.pause();
  }
  showControls();
}

// Tap = toggle play/pause; also show controls briefly
let lastTap = 0;
function handleTap(e) {
  e.preventDefault();
  const now = Date.now();
  if (now - lastTap < 300) return; // ignore double-tap
  lastTap = now;
  if (controls.classList.contains('hidden')) {
    showControls();
  } else {
    togglePlay();
  }
}

function showControls() {
  controls.classList.remove('hidden');
  clearTimeout(controlsTimer);
  if (!vid.paused) {
    controlsTimer = setTimeout(() => controls.classList.add('hidden'), 3000);
  }
}

// Update play button icon based on state
vid.addEventListener('play', () => {
  btnPlay.textContent = '⏸';
  controlsTimer = setTimeout(() => controls.classList.add('hidden'), 3000);
});
vid.addEventListener('pause', () => {
  btnPlay.textContent = '▶';
  controls.classList.remove('hidden');
  clearTimeout(controlsTimer);
});
vid.addEventListener('ended', () => {
  btnPlay.textContent = '▶';
  controls.classList.remove('hidden');
  progress.value = 0;
});

// Progress update
vid.addEventListener('timeupdate', () => {
  if (scrubbing || !vid.duration) return;
  const pct = (vid.currentTime / vid.duration) * 100;
  progress.value = pct;
  document.getElementById('time-cur').textContent = fmtTime(vid.currentTime);
  document.getElementById('time-dur').textContent = fmtTime(vid.duration);
});

function seekVideo(val) {
  if (!vid.duration) return;
  vid.currentTime = (val / 100) * vid.duration;
  showControls();
}

function fmtTime(s) {
  if (!s || isNaN(s)) return '0:00';
  const m = Math.floor(s/60);
  const sec = Math.floor(s%60);
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

function toggleNativeFS() {
  if (vid.requestFullscreen) vid.requestFullscreen();
  else if (vid.webkitEnterFullscreen) vid.webkitEnterFullscreen(); // iOS Safari
}

/* ── Dialog ── */
function openDialog() { document.getElementById('dialog').classList.add('open'); }
function closeDialog() {
  document.getElementById('dialog').classList.remove('open');
  document.getElementById('inp-title').value = '';
  document.getElementById('inp-emoji').value = '';
  document.getElementById('file-label').textContent = 'Tippen um Datei auszuwählen';
  document.getElementById('file-input').value = '';
  currentFile = null;
}

function handleFile(file) {
  if (!file) return;
  currentFile = file;
  document.getElementById('file-label').textContent = '✅ ' + file.name;
}
function handleDrop(e) {
  e.preventDefault();
  document.getElementById('file-drop').classList.remove('drag');
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith('video/')) handleFile(f);
}

function addVideo() {
  const title = document.getElementById('inp-title').value.trim();
  const cat = document.getElementById('inp-cat').value;
  const emoji = document.getElementById('inp-emoji').value.trim();
  if (!title) { alert('Bitte einen Titel eingeben.'); return; }
  if (!currentFile) { alert('Bitte eine Videodatei auswählen.'); return; }
  const url = URL.createObjectURL(currentFile);
  videos.push({ title, category: cat, emoji, url, date: Date.now() });
  save();
  closeDialog();
  renderGrid();
  renderTabs();
}

function deleteVideo(e, idx) {
  e.stopPropagation();
  if (!confirm('Video löschen?')) return;
  try { URL.revokeObjectURL(videos[idx].url); } catch(e) {}
  videos.splice(idx, 1);
  save();
  renderGrid();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closePlayer(); closeDialog(); }
});

renderTabs();
renderGrid();
</script>
</body>
</html>
